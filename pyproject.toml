[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор CSV и JSONL логов"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.12.0", "mypy>=1.18.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamstats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
